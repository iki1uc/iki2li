<script type="module">
  import { idState } from "./kiq/id-state.js";
  import { trianglePrep } from "./kiq/triangle-prep.js";
  import { identVector } from "./kiq/ident-vector.js";

  const id = idState();
  const tri = trianglePrep();
  const ident = identVector();

  document.getElementById("id-status").innerHTML = `
ID:       ${id.id}
Axis:     ${id.axis}
Instance: ${id.instance}
Base:     ${id.base}
IDENT‑Vektor: [${ident.vector[0]}, ${ident.vector[1]}]
  `;

  document.getElementById("triangle-status").innerHTML = `
Winkel A: ${tri.w1}°
Winkel B: ${tri.w2}°
Summe:    ${tri.sum}°
Dreieck:  ${tri.valid ? "JA" : "NEIN"}
IDENT‑Vektor: [${ident.vector[0]}, ${ident.vector[1]}]
  `;
</script>
