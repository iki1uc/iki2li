<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>UI‑OFFICER</title>

  <script type="module">
    import { OFFICER_HANDLER } from "./kiq/officer-handler.js";
    import { scanData } from "./kiq/mock-scan.js";
    import { toolData } from "./kiq/mock-tool.js";

    const P0 = { x: Math.PI, y: 0 };
    const BASE = "µiki1uc";

    document.getElementById("officer-btn").onclick = () => {

      const res = OFFICER_HANDLER.check(scanData, toolData);

      document.getElementById("officer-out").innerHTML = `
        <b>OFFICER – VALIDATION</b><br>
        Base: ${BASE}<br>
        Fusion: ${res.fusion.complete}<br>
        Valid: ${res.validation.valid}<br>
        Issues: ${res.validation.issues.join(", ") || "Keine"}<br>
        Pixel/Achsen: ${res.validation.stats.pixelCount} / ${res.validation.stats.axisCount}
      `;
    };
  </script>
</head>

<body>
  <button id="officer-btn">VALIDIEREN</button>
  <pre id="officer-out"></pre>
</body>
</html>
