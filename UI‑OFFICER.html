<script type="module">
import { OFFICER_HANDLER } from "./kiq/officer-handler.js";
import { scanData } from "./kiq/mock-scan.js";
import { toolData } from "./kiq/mock-tool.js";

document.getElementById("officer-btn").onclick = () => {
    const res = OFFICER_HANDLER.check(scanData, toolData);

    document.getElementById("officer-law").innerHTML = `
        <div style="
            padding:20px;
            background:#000;
            color:#0ff;
            font-size:20px;
            border:2px solid #0ff;
            margin-bottom:20px;
        ">
            OFFICER‑PROTOKOLL<br>
            Fusion komplett: ${res.fusion.complete}<br>
            Validator gültig: ${res.validation.valid}<br>
            Issues: ${res.validation.issues.join(", ") || "Keine"}<br>
            Pixel/Achsen: ${res.validation.stats.pixelCount} / ${res.validation.stats.axisCount}
        </div>
    `;
};
</script>
