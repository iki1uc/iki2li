<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>UI‑SCANNER</title>

  <script type="module">
    import { VECTOR_SCANNER } from "./kiq/vector-scanner.js";
    import { scanData } from "./kiq/mock-scan.js";

    const P0 = { x: Math.PI, y: 0 };   // 0‑Punkt (PI)
    const BASE = "µiki1uc";            // Basis für alle 3

    document.getElementById("scan-btn").onclick = () => {

      const p1 = scanData.points[0];
      const p2 = scanData.points[1];
      const p3 = scanData.points[2];

      const vA = VECTOR_SCANNER.toVector(P0, p1);
      const vB = VECTOR_SCANNER.toVector(P0, p2);
      const vC = VECTOR_SCANNER.toVector(P0, p3);

      const tri = VECTOR_SCANNER.triangle(vA, vB, vC);

      document.getElementById("scan-out").innerHTML = `
        <b>SCANNER – RAW</b><br>
        Base: ${BASE}<br>
        A: ${tri.AB.toFixed(2)}°<br>
        B: ${tri.BC.toFixed(2)}°<br>
        C: ${tri.CA.toFixed(2)}°
      `;
    };
  </script>
</head>

<body>
  <button id="scan-btn">SCAN</button>
  <pre id="scan-out"></pre>
</body>
</html>
