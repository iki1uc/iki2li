<script>
const engine = document.getElementById('engine');

let masterX = 0;   // Forward/Rew-Achse
let followerY = 0; // Layer
let followerZ = 0; // Zoom

engine.focus(); // wichtig: Fokus auf den Container legen

engine.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') {
    e.preventDefault();
    stepForward();
  }
  if (e.key === 'ArrowLeft') {
    e.preventDefault();
    stepRewind();
  }
});

function stepForward() {
  masterX += 1;
  followerY += 0.2;
  followerZ += 0.1;
  updateEngine();
}

function stepRewind() {
  masterX -= 1;
  followerY -= 0.2;
  followerZ -= 0.1;
  updateEngine();
}

function updateEngine() {
  console.log('X:', masterX, 'Y:', followerY, 'Z:', followerZ);
}
</script>
