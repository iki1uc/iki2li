<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>iki2li – CORE UI</title>

  <!-- CORE ENGINE -->
  <script type="module" src="./iki2li.js"></script>

  <style>
    body {
      background:#000;
      color:#0ff;
      font-family:Consolas, monospace;
      padding:20px;
    }
    h1 { margin-bottom:10px; }
    button {
      background:#0ff;
      color:#000;
      border:none;
      padding:10px 20px;
      font-weight:bold;
      cursor:pointer;
      margin-right:10px;
    }
    pre {
      background:#111;
      padding:20px;
      border:2px solid #0ff;
      border-radius:10px;
      margin-top:20px;
      overflow:auto;
    }
  </style>

</head>

<body>

  <h1>iki2li – CORE UI</h1>

  <button id="run-core">RUN CORE</button>
  <button id="run-engine">RUN ENGINE</button>
  <button id="run-matrix">RUN MATRIX</button>
  <button id="run-state">RUN STATE</button>
  <button id="run-phase">RUN PHASE</button>
  <button id="run-profiles">RUN PROFILES</button>
  <button id="run-log">RUN LOG</button>

  <pre id="output"></pre>

  <script type="module">
    import iki2li from "./iki2li.js";

    const out = document.getElementById("output");

    function show(data) {
      out.textContent = JSON.stringify(data, null, 2);
    }

    document.getElementById("run-core").onclick = () => {
      show({
        core: iki2li.core || "no core",
        version: iki2li.version || "unknown",
        ident: iki2li.ident || "none"
      });
    };

    document.getElementById("run-engine").onclick = () => {
      show(iki2li.engine || { error:"engine missing" });
    };

    document.getElementById("run-matrix").onclick = () => {
      show(iki2li.matrix || { error:"matrix missing" });
    };

    document.getElementById("run-state").onclick = () => {
      show(iki2li.state || { error:"state missing" });
    };

    document.getElementById("run-phase").onclick = () => {
      show(iki2li.phase || { error:"phase missing" });
    };

    document.getElementById("run-profiles").onclick = () => {
      show(iki2li.profiles || { error:"profiles missing" });
    };

    document.getElementById("run-log").onclick = () => {
      show(iki2li.log || { error:"log missing" });
    };
  </script>

</body>
</html>
